#app.wide{grid-template-columns:minmax(0,1fr) 36%;grid-template-rows:auto minmax(0,1fr) auto auto;column-gap:8px;

/* ---------- rendering ---------- */
function card(id, cls) { return '<div class="card ' + (cls || '') + '" data-id="' + id + '">' + CardFace.svg(id) + '</div>'; }

  var step = Math.max(4, Math.min(mw * 0.85, (rowW - 3 * mw - 14) / 21)), step2 = Math.max(4, Math.min(mw * 0.85, (rowW - mw) / 23));

      arr.map(function (id, i) { return '<div class="card mini' + (news.indexOf(id) >= 0 && S.cur.p === p ? ' new' : '') + '" data-id="' + id + '" style="left:' + (i * st) + 'px">' + CardFace.svg(id) + '</div>'; }).join('') + '</div></div>';
  }
  return '<div class="caprow">' + grp('G', 5, step) + grp('A', 9, step) + grp('R', 10, step) + '</div><div class="caprow">' + grp('J', 24, step2) + '</div>';

function wide() { return $('app').classList.contains('wide'); }
function scoreLine(p) {

}
function infoHTML(p) {

function render() {

  var canTgt = myAction() && (S.phase === 'pickHand' || S.phase === 'pickStock') ? S.cands : [];
  var selM = sel >= 0 && S.phase === 'play' && myAction() ? mon(sel) : -1, hf = hintObj && hintObj.target, hpick = hintObj && hintObj.type === 'pick' ? hintObj.card : -1;
  $('field').innerHTML = order.map(function (m) {

  }).join('');
  /* stock + last */

  $('pile').style.width = pw + 'px'; $('pile').style.height = (pw * 1.55 + 4) + 'px';
  $('pile').innerHTML = (sn > 1 ? '<div class="card back" style="left:3px;top:3px"></div>' : '') + (sn > 0 ? '<div class="card back"></div>' : '') + '<div class="n">' + sn + '</div>';
  var lh = '';

  else t = S.phase === 'go' ? T('oppGo') : T('oppT');

  m.textContent = t; m.className = you ? 'you' : '';

    GS.shakable(S, me).forEach(function (mm) { acts += '<button class="pri' + (hintObj && hintObj.type === 'shake' ? ' hint' : '') + '" data-k="shake" data-m="' + mm + '">' + T('shake', mm + 1) + '</button>'; });
    if (S.skips[me] > 0) acts += '<button data-k="skip"' + (hintObj && hintObj.type === 'skip' ? ' class="hint"' : '') + '>' + T('skip') + ' (' + S.skips[me] + ')</button>';
  }
  $('acts').innerHTML = acts;
  var gb = $('gsbox');
  if (myAction() && S.phase === 'go') {
    var pv = GS.settle(S, me);
    gb.innerHTML = '<div class="t">' + T('goT', pv.sc[me]) + '</div><div style="font-size:12px;margin-bottom:8px;opacity:.9">' + T('stopV', pv.pts) + '<br>' + T('goV') + '</div><button class="pri' + (hintObj && hintObj.yes ? ' hint' : '') + '" data-a="go">' + T('go') + '</button><button class="stop' + (hintObj && hintObj.type === 'go' && !hintObj.yes ? ' hint' : '') + '" data-a="stop">' + T('stop') + '</button>';

function ctrlHTML() {

    '<button data-k="hint">' + T('hint') + '</button><button data-k="auto" class="' + (autoOn ? 'on' : '') + '">' + T('auto') + '</button>';

/* ---------- test / headless hooks ---------- */

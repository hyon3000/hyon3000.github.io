<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>One Card</title>
<script>window.__errs=[];window.addEventListener('error',function(e){window.__errs.push(e.message+' @'+e.filename+':'+e.lineno)});</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d3b2a;color:#f2f2e8;font:13px/1.3 "Segoe UI","Malgun Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{height:100%;width:100%;max-width:980px;margin:0 auto;padding:4px 6px;display:grid;gap:3px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto auto auto;
 grid-template-areas:"oinfo" "ohand" "mid" "status" "acts" "mhand" "ctrl"}
html{background:radial-gradient(ellipse at 50% 40%,#18643f 0,#0d3b2a 80%) fixed}
.card{position:relative;width:var(--w);height:calc(var(--w)*1.4);flex:none;border-radius:calc(var(--w)*.09);box-shadow:0 1px 4px rgba(0,0,0,.55);background:#fff;transition:transform .12s,box-shadow .12s,filter .12s}
.card svg{width:100%;height:100%;display:block;pointer-events:none}
.card.back{background:none}
#oinfo{grid-area:oinfo;display:flex;align-items:center;gap:8px;min-height:20px;font-weight:600;white-space:nowrap;overflow:hidden}
#oinfo .sp{flex:1}
.pill{background:#0006;border-radius:10px;padding:0 9px;font-weight:700}.pill b{color:#ffd54a}
.pill.warn{background:#c9302c;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
#ohand{grid-area:ohand;display:flex;justify-content:center;align-items:center;height:calc(var(--ow)*1.4 + 4px);--w:var(--ow);overflow:hidden}
#mid{grid-area:mid;min-height:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--cw)*.5);--w:var(--cw);position:relative}
.pilebox{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
#drawpile{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);cursor:pointer}
#drawpile .card{position:absolute;left:0}
#drawpile .n{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:800;font-size:calc(var(--cw)*.36);color:#fff;text-shadow:0 1px 4px #000,0 0 6px #000;z-index:3}
#discpile{position:relative;width:var(--cw);height:calc(var(--cw)*1.4)}
#discpile .card{position:absolute;left:0;top:0}
.cap{font-size:11px;opacity:.85;min-height:14px;text-align:center;white-space:nowrap}
#suitchip{position:absolute;right:calc(var(--cw)*-.3);top:calc(var(--cw)*-.1);width:calc(var(--cw)*.5);height:calc(var(--cw)*.5);border-radius:50%;background:#fff;border:3px solid #ffd54a;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 6px #000a}
#suitchip svg{width:62%;height:62%}
#atk{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;top:calc(var(--cw)*-.34);min-width:calc(var(--cw)*.62);height:calc(var(--cw)*.5);padding:0 6px;border-radius:calc(var(--cw)*.25);background:#d62839;border:3px solid #fff;color:#fff;font-weight:900;font-size:calc(var(--cw)*.3);display:none;align-items:center;justify-content:center;z-index:6;box-shadow:0 2px 8px #000b}
#atk.on{display:flex;animation:pop .35s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.card.hint,#drawpile.hint{outline:3px solid #ffe14a;outline-offset:2px;box-shadow:0 0 14px 4px #ffe14a;z-index:7}
#drawpile.hint{border-radius:calc(var(--cw)*.09)}
#status{grid-area:status;display:flex;flex-direction:column;gap:2px}
#msg{font-weight:600;font-size:13px;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.35);min-height:24px;display:flex;align-items:center}
#msg.you{background:rgba(40,120,60,.75)}
#sub{font-size:11px;opacity:.85;min-height:14px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#acts{grid-area:acts;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:36px;align-items:center}
button{font:inherit;color:#fff;background:#3b5a4a;border:1px solid #6f9a84;border-radius:7px;padding:5px 11px;cursor:pointer;touch-action:manipulation}
button:hover{background:#4b7360}
button.pri{background:#2f8f4f;border-color:#7ad596}
button.one{background:#c98a14;border-color:#ffd54a;font-weight:800;font-size:15px;padding:6px 16px}
button.one.on{background:#e0a21e;box-shadow:0 0 0 2px #fff6}
button.catch{background:#b53b30;border-color:#f09a8f;font-weight:800;font-size:15px;padding:6px 16px}
button.hint{outline:3px solid #ffe14a;box-shadow:0 0 10px #ffe14a}
button.on{background:#c98a14;border-color:#ffd54a}
button:disabled{opacity:.45;cursor:default}
#mhand{grid-area:mhand;--w:var(--hw);display:flex;align-items:flex-end;overflow-x:auto;overflow-y:hidden;padding:calc(var(--hw)*.2) 4px 4px;min-height:calc(var(--hw)*1.4 + var(--hw)*.2 + 8px);scrollbar-width:thin}
#mhand .card:first-child{margin-left:auto}
#mhand .card:last-child{margin-right:auto}
#mhand .card{cursor:pointer}
#mhand .card.ok{transform:translateY(calc(var(--hw)*-.16))}
#mhand .card.no{filter:brightness(.62)}
#mhand .card.fresh{box-shadow:0 0 10px 3px #ff9a3c}
#ctrl{grid-area:ctrl;display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;color:#ffe14a;text-shadow:0 2px 6px #000,0 0 14px #c60;pointer-events:none;opacity:0;white-space:nowrap;z-index:30}
#toast.show{animation:tst 1.4s ease-out}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:40}
.dlg{background:#1b2b25;border:2px solid #ffd54a;border-radius:12px;padding:12px 14px;width:min(400px,94vw);max-height:92vh;overflow:auto;box-shadow:0 8px 30px #000a}
.dlg h3{margin:0 0 8px;font-size:19px;text-align:center}
.dlg .btns{display:flex;gap:8px;justify-content:center;margin-top:10px}
#suits{display:flex;gap:10px;justify-content:center}
#suits button{width:64px;height:64px;padding:8px;background:#fff;border:3px solid #ffd54a;border-radius:12px}
#suits button svg{width:100%;height:100%}
#suits button.best{box-shadow:0 0 0 3px #5dff8a}
#helpTxt{font-size:12px;line-height:1.55}
#helpTxt p{margin:0 0 6px}
</style>

/* ---------- public API (called by the shell) ---------- */
function newGame(auto) {

/* ---------- user input ---------- */

  h.forEach(function (x) { if (!OC.isJoker(x)) cs[OC.suit(x)]++; }); for (i = 1; i < 4; i++) if (cs[i] > cs[best]) best = i;

$('suits').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || pickCard < 0) return;
  var id = pickCard, s = +b.dataset.s; pickCard = -1; $('picker').style.display = 'none';
  act({ type: 'play', card: id, suit: s, call: preCall });
});
$('pickX').onclick = function () { pickCard = -1; $('picker').style.display = 'none'; render(); };
$('drawpile').addEventListener('click', tapDraw);
$('mhand').addEventListener('click', function (e) { var c = e.target.closest('.card'); if (c) tapHand(+c.dataset.id); });
$('resNew').onclick = function () { $('res').style.display = 'none'; newGame(); };
$('resClose').onclick = function () { $('res').style.display = 'none'; };
$('helpX').onclick = function () { $('help').style.display = 'none'; };
function showHelp() { $('helpH').textContent = KO ? '원카드 규칙' : 'One Card rules'; $('helpTxt').innerHTML = HELP; $('helpX').textContent = T('close'); $('help').style.display = 'flex'; }
document.addEventListener('keydown', function (e) {
  if (window.parent !== window && window.parent.setAutoMark) return;      // inside the card shell: the shell forwards F2..F5 itself (handling them here too would toggle twice)

});

/* ---------- rendering ---------- */
function cardHtml(id, cls, extra) { return '<div class="card ' + (cls || '') + '" data-id="' + id + '"' + (extra || '') + '>' + (id < 0 ? TF.back() : TF.svg(id)) + '</div>'; }
function fit(n, w, avail, min) {   /* margin-left of the cards 2..n so that n cards of width w fit into avail (never tighter than min*w visible) */

}
function render() {

  var avail = Math.min(W, 980) - 20;

  for (k = 0; k < lim; k++) dh += cardHtml(-1, 'back', ' style="top:' + (-(lim - 1 - k) * 2) + 'px;left:' + (-(lim - 1 - k) * 1) + 'px;width:var(--cw)"');

  $('dcap').textContent = S && S.atk > 0 && S.turn === me && S.phase === 'play' ? T('dcapAtk', S.atk) : T('pile');

  h.forEach(function (c, j) {
    var cls = (mine && lg.indexOf(c) >= 0 ? 'ok ' : (mine ? 'no ' : '')) + (hintObj && hintObj.type === 'play' && hintObj.card === c ? 'hint ' : '') + (c === fresh && mine ? 'fresh ' : '');
    mh += cardHtml(c, cls, j ? ' style="margin-left:' + ml2.toFixed(1) + 'px"' : '');
  });
  $('mhand').innerHTML = mh;
  /* status */

  else if (S.turn === me) {
    you = true;
    msg = waiting ? '...' : S.phase === 'drawn' ? T('drawnT') : S.atk > 0 ? T('defT', S.atk) : T('yourT');
    if (hintObj) msg += '  ' + T('hintT') + hintText(hintObj);
  } else msg = S.phase === 'drawn' ? T('oppDrawnT') : S.atk > 0 ? T('oppDefT', S.atk) : T('oppT');

    if (OC.catchable(S, me)) ab += '<button id="bCatch" class="catch' + (hintObj && hintObj.type === 'catch' ? ' hint' : '') + '"' + (waiting ? ' disabled' : '') + '>' + T('catch') + '</button>';

}
function hintText(h) {

$('ctrl').addEventListener('click', function (e) {

  ({ new: function () { newGame(); }, hint: giveHint, auto: toggleAuto, online: startOnline, help: showHelp })[b.dataset.k]();

window.newGame = function () { newGame(); };

window.isOnline = function () { return mode === 'online'; };

window.isAuto = isAuto;
window.__oc = {
  OC: OC, state: function () { return S; }, mode: function () { return mode; }, me: function () { return me; }, act: act, setSpeed: function (x) { speed = x; },

})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Riichi Mahjong</title>
<script>window.__errs=[];window.addEventListener('error',function(e){window.__errs.push(e.message+' @'+e.filename+':'+e.lineno)});</script>
<style>
*{box-sizing:border-box}
:root{--S:600px}
html,body{margin:0;height:100%;overflow:hidden;background:#0d3b2a;color:#f2f2e8;font:13px/1.3 "Segoe UI","Malgun Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:3px 4px;background:radial-gradient(ellipse at 50% 35%,#18643f 0,#0d3b2a 85%)}
#table{position:relative;flex:none;width:var(--S);height:var(--S);border-radius:calc(var(--S)*.02);background:radial-gradient(circle at 50% 50%,#1f7a4c 0,#17603c 60%,#124d31 100%);box-shadow:inset 0 0 0 2px #0a2e1f,0 4px 16px #0008;overflow:hidden}
/* ---- tiles */
.t{position:relative;flex:none;width:var(--tw);height:calc(var(--tw)*1.33);border-radius:calc(var(--tw)*.14);background:linear-gradient(180deg,#fbf8ee 0,#efe9d6 100%);box-shadow:0 calc(var(--tw)*.07) 0 #b9ad8c,0 calc(var(--tw)*.1) calc(var(--tw)*.08) #0007;border:1px solid #cfc6aa}
.t img{position:absolute;left:7%;top:5%;width:86%;height:90%;display:block;pointer-events:none;-webkit-user-drag:none}
.t.back{background:linear-gradient(135deg,#2c8f6b 0,#1b6b4f 100%);border-color:#0e4733;box-shadow:0 calc(var(--tw)*.07) 0 #0b3a29,0 calc(var(--tw)*.1) calc(var(--tw)*.08) #0007}
.t.back::after{content:"";position:absolute;inset:14%;border:1px solid #ffffff30;border-radius:calc(var(--tw)*.08)}
.t.dim{filter:brightness(.55)}
.t.haku img{display:none}.t.haku::before{content:"";position:absolute;left:24%;right:24%;top:20%;bottom:20%;border:max(2px,calc(var(--tw)*.07)) solid #3a5fb0;border-radius:calc(var(--tw)*.08)}
.t.last{outline:2px solid #ffd54a;outline-offset:1px}
.t.tg{filter:brightness(.88)}
.rot{position:relative;flex:none;width:calc(var(--tw)*1.33);height:var(--tw);align-self:flex-end}
.rot>.t{position:absolute;left:50%;top:50%;margin-left:calc(var(--tw)*-.5);margin-top:calc(var(--tw)*-.665);transform:rotate(90deg) translate(calc(var(--tw)*.165),calc(var(--tw)*.165))}
.rot.stk{height:calc(var(--tw)*2);}
.rot.stk>.t{display:none}
.rot.stk>.col{position:absolute;inset:0;display:flex;flex-direction:column}
.rot.stk .rot{width:100%;height:var(--tw);align-self:auto}
/* ---- boards */
.bd{position:absolute;inset:0;pointer-events:none}
.b1{transform:rotate(-90deg)}.b2{transform:rotate(180deg)}.b3{transform:rotate(90deg)}
.hand{position:absolute;left:0;right:0;bottom:calc(var(--S)*.01);display:flex;justify-content:center;align-items:flex-end;gap:calc(var(--S)*.014)}
.conc,.melds{display:flex;align-items:flex-end}
.melds{gap:calc(var(--S)*.008)}
.meld{display:flex;align-items:flex-end}
.b0 .conc .t{--tw:calc(var(--S)*.0655)}
.b0 .melds .t,.b0 .melds .rot{--tw:calc(var(--S)*.046)}
.b1 .hand .t,.b2 .hand .t,.b3 .hand .t,.b1 .melds .rot,.b2 .melds .rot,.b3 .melds .rot{--tw:calc(var(--S)*.04)}
.conc .gap{width:calc(var(--S)*.016);flex:none}
.river{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:calc(var(--S)*.004)}
.b0 .river{bottom:calc(var(--S)*.105)}
.b1 .river,.b2 .river,.b3 .river{bottom:calc(var(--S)*.083)}
.rrow{display:flex;align-items:flex-end;justify-content:flex-start;gap:calc(var(--S)*.001)}
.river .t,.river .rot{--tw:calc(var(--S)*.043)}
#hand0{pointer-events:auto}
#hand0 .t{cursor:pointer;touch-action:none;transition:transform .08s}
#hand0 .t.sel{transform:translateY(-14%)}
#hand0 .t.hint,.t.hint{outline:3px solid #ffe14a;outline-offset:1px;box-shadow:0 0 12px 3px #ffe14a;z-index:5}
#hand0 .t.ok{box-shadow:0 calc(var(--tw)*.07) 0 #b9ad8c,0 0 8px 2px #7dffb0}
/* ---- center */
#center{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:calc(var(--S)*.014);background:#0a2e1fb0;border:1px solid #ffffff22;display:grid;grid-template-columns:1fr 1.25fr 1fr;grid-template-rows:1fr 1.25fr 1fr;color:#f5f1de}
.sc{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--S)*.0215);line-height:1.15;border-radius:calc(var(--S)*.008);margin:2px;min-width:0}
.sc b{font-size:calc(var(--S)*.026);font-weight:700;color:#ffe9a6}
.sc .nm{opacity:.85;font-size:calc(var(--S)*.017);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sc .wd{display:inline-block;min-width:1.5em;padding:0 .25em;border-radius:3px;background:#ffffff26;font-weight:700;margin-right:.2em}
.sc.dealer .wd{background:#c43c2e;color:#fff}
.sc.turn{background:#ffd54a30;box-shadow:inset 0 0 0 1px #ffd54a}
.sc.s0{grid-area:3/2}.sc.s1{grid-area:2/3}.sc.s2{grid-area:1/2}.sc.s3{grid-area:2/1}
.sc .rch{color:#ff8a7a;font-size:calc(var(--S)*.015);font-weight:700}
#mid{grid-area:2/2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:calc(var(--S)*.021);line-height:1.2}
#mid .rn{font-size:calc(var(--S)*.032);font-weight:800;color:#fff}
#mid .sm{opacity:.9}
.stick{display:inline-block;width:calc(var(--S)*.04);height:calc(var(--S)*.007);background:#f3efe0;border-radius:2px;box-shadow:0 0 0 1px #8a8467;vertical-align:middle;position:relative}
.stick::after{content:"";position:absolute;left:46%;top:1px;width:2px;height:calc(100% - 2px);background:#c1352c;border-radius:50%}
#corner1{position:absolute;left:calc(var(--S)*.012);top:calc(var(--S)*.012);display:flex;flex-direction:column;gap:calc(var(--S)*.004);font-size:calc(var(--S)*.018);opacity:.97}
#corner1 .row{display:flex;gap:calc(var(--S)*.003)}
#corner1 .t{--tw:calc(var(--S)*.036)}
#corner2{position:absolute;right:calc(var(--S)*.014);top:calc(var(--S)*.012);text-align:right;font-size:calc(var(--S)*.019);line-height:1.25;text-shadow:0 1px 2px #000a}
#corner3{position:absolute;left:calc(var(--S)*.014);bottom:calc(var(--S)*.115);font-size:calc(var(--S)*.019);}
.tag{display:inline-block;padding:1px 6px;border-radius:99px;font-weight:700;font-size:calc(var(--S)*.019);background:#0007}
.tag.bad{background:#b53b30;color:#fff}.tag.ok{background:#2f8f4f}
.fl{position:absolute;font-weight:900;font-size:calc(var(--S)*.06);color:#ffe14a;text-shadow:0 2px 6px #000,0 0 14px #c60;pointer-events:none;animation:fl 1.1s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%);z-index:30}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
/* ---- below the table */
#msg{flex:none;width:var(--S);min-height:calc(var(--S)*.062);font-weight:600;font-size:13px;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.35);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#msg.you{background:rgba(40,120,60,.75)}
#msg .t{--tw:20px}
#acts button{min-height:40px}
#acts{flex:none;width:var(--S);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:44px;align-items:center}
#bar{flex:none;width:var(--S);display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
button{font:inherit;color:#fff;background:#3b5a4a;border:1px solid #6f9a84;border-radius:8px;padding:6px 12px;cursor:pointer;touch-action:manipulation;min-height:32px}
button:hover{background:#4b7360}
button.pri{background:#2f8f4f;border-color:#7ad596}
button.win{background:#c0392b;border-color:#ff9d8f;font-weight:800;font-size:15px;padding:8px 18px}
button.call{background:#2a6fb0;border-color:#8ec3f5;font-weight:700;font-size:14px;padding:6px 14px;display:inline-flex;align-items:center;gap:4px}
button.call .t{--tw:16px}
button.on{background:#c98a14;border-color:#ffd54a}
button.hint{outline:3px solid #ffe14a;box-shadow:0 0 10px #ffe14a}
button:disabled{opacity:.45;cursor:default}
/* ---- dialogs */
#res,#help{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,96vw);max-height:94vh;overflow:auto;background:#12261fF2;border:2px solid #ffd54a;border-radius:12px;padding:12px 14px;z-index:60;box-shadow:0 8px 30px #000b;display:none;-webkit-user-select:text;user-select:text}
#res h3,#help h3{margin:0 0 6px;font-size:18px;text-align:center;color:#ffe9a6}
#res .win{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #ffffff22}
#res .hrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px;margin:4px 0}
#res .hrow .t,#res .hrow .rot{--tw:min(24px,calc((100vw - 74px)/14.8))}
#res .hrow .sp{width:10px}
#res table{width:100%;border-collapse:collapse;font-size:13px}
#res td{padding:1px 4px}#res td:last-child{text-align:right;font-weight:700}
#res .big{font-size:16px;font-weight:800;text-align:center;margin:4px 0;color:#ffd54a}
#res .btns{display:flex;gap:8px;justify-content:center;margin-top:10px}
#res .pl{display:flex;justify-content:space-between}
.pos{color:#7dffb0}.neg{color:#ff8a7a}
#help{font-size:13px;line-height:1.45}
#help p{margin:5px 0}
#help a{color:#9fd4ff}
.ky{display:inline-block;padding:0 5px;border-radius:4px;background:#ffffff22}
#curtain{position:fixed;inset:0;background:#0006;z-index:50;display:none}
@media (max-width:520px){#msg{font-size:12px}button{padding:5px 9px}}
</style>
</head>
<body>
<div id="app">
 <div id="table">
  <div class="bd b3" id="bd3"></div><div class="bd b2" id="bd2"></div><div class="bd b1" id="bd1"></div><div class="bd b0" id="bd0"></div>
  <div id="center"></div>
  <div id="corner1"></div><div id="corner2"></div><div id="corner3"></div>
 </div>
 <div id="msg"></div>
 <div id="acts"></div>
 <div id="bar"></div>
</div>
<div id="curtain"></div>
<div id="res"></div>
<div id="help"></div>

  helpT: ['How to play', '게임 방법'],
  help1: [
    '<p><b>Riichi Mahjong (Japanese mahjong)</b>, East-only game: you (South seat, bottom) vs 3 computer players. 136 tiles, 25,000 points each. The game lasts East 1-4 (dealer repeats when the dealer wins or is tenpai; the game ends when somebody drops below 0, or when the East-4 dealer is top with 30,000+ after a win or tenpai draw).</p>' +
    '<p><b>Turn</b>: you draw a tile and discard one. Tap a tile to select it and tap it again (or drag it upwards) to discard. After others discard you may <span class="ky">Chi</span> (only from the player on your left, for a sequence), <span class="ky">Pon</span> (triplet) or <span class="ky">Kan</span>; closed/added kan appears on your turn. <span class="ky">Ron</span> wins on a discard, <span class="ky">Tsumo</span> on your own draw. <span class="ky">Pass</span> declines.</p>' +
    '<p><b>Riichi</b>: with a closed tenpai hand and 1000+ points press Riichi, then discard the highlighted tile; afterwards the hand is locked (you discard each draw automatically). Bonus: ippatsu, ura-dora. <b>Furiten</b>: you cannot ron if any of your waiting tiles is in your own discards (also temporarily after passing a winning tile; permanently in riichi).</p>' +
    '<p><b>Scoring</b>: at least one yaku is required. Dora, ura-dora and the red fives (1 per suit) add han. Han/fu give the points (mangan 5 han, haneman 6-7, baiman 8-10, sanbaiman 11-12, yakuman 13+). Honba sticks add 300 per honba. Exhaustive draw: tenpai players share 3000. Abortive draws: nine terminals (you may declare it on your first turn), four winds, four riichi, four kans, triple ron. Nagashi mangan is supported.</p>' +

    '<p><b>리치 마작 (일본 마작)</b> 동풍전: 나(남가, 아래)와 컴퓨터 3명. 패 136장, 각자 25,000점. 동1국~동4국까지 진행하며, 친이 화료하거나 텐파이면 연장합니다. 누군가의 점수가 0 미만이 되면 종료하고, 동4국 친이 화료/텐파이 유국이고 30,000점 이상으로 1위이면 종료합니다.</p>' +

    '<p><b>점수</b>: 역이 하나 이상 필요합니다. 도라, 뒷도라, 적5(무늬별 1장)는 판을 더합니다. 만관 5판, 하네만 6~7판, 배만 8~10판, 삼배만 11~12판, 역만 13판 이상. 본장 1개당 300점. 유국 시 텐파이자가 3000점을 나눠 받습니다. 도중유국: 구종구패(첫 턴에 선언 가능), 사풍연타, 사가리치, 사개깡, 삼가화. 유국만관을 지원합니다.</p>' +

  var s = '<div class="hrow">' + h.map(function (x) { return TL(x); }).join('');
  if (winTile != null) s += '<div class="sp"></div>' + TL(winTile);
  s += '<div class="sp"></div>' + r.melds[p].map(function (m) { return meldHTML(m, p, p); }).join('') + '</div>';
  return s;
}
function pointsText(w, r) {
  var e = w.eval, s = '', ko = KO;
  if (e.yakuman) s += MJ.limitName(e.name, ko) || T('ykm');
  else { s += T('han', e.han) + ' ' + T('fu', e.fu); if (e.name) s += ' - ' + MJ.limitName(e.name, ko); }
  s += ' : ' + T('pts', e.ten);
  if (w.tsumo) { var dealer = w.p === r.dealer; s += dealer ? ' (' + T('all', e.oya[0]) + ')' : ' (' + e.ko[1] + ' / ' + e.ko[0] + ')'; }
  var extra = [];
  if (r.honba && (w.tsumo || w.sticks !== undefined)) extra.push(T('honbaB', r.honba));
  if (w.sticks) extra.push(T('sticksB', w.sticks / 1000));
  return s + (extra.length ? '<div style="font-size:12px;opacity:.85;font-weight:400">' + extra.join(', ') + '</div>' : '');
}
function showResult() {
  var r = G.result;
  var key = G.rounds_shown = (G.stats.rounds);
  if (ui.resShown === key) return;
  ui.resShown = key;
  var h = '';
  if (r.type === 'tsumo' || r.type === 'ron') {
    r.wins.forEach(function (w) {
      var title = NAME(w.p) + ' - ' + (w.tsumo ? T('tsumoR') : (w.chankan ? T('chankanR') : T('ronR')));
      if (!w.tsumo) title += '  (' + NAME(r.from) + ')';
      h += '<div class="win"><h3>' + title + '</h3>' + handRow(w.p, r, w.tile, w.tsumo);
      h += '<div class="hrow" style="font-size:12px;align-items:center">' + T('dora') + ': ' + r.doraInds.map(function (x) { return TL(x); }).join('');
      if (r.riichi[w.p]) h += '<span style="margin-left:8px">' + T('ura') + ': </span>' + r.uraInds.map(function (x) { return TL(x); }).join('');
      h += '</div><table>';
      w.eval.yaku.forEach(function (y) { h += '<tr><td>' + MJ.yakuName(y.jp, KO) + '</td><td>' + (y.yakuman ? T('ykm') + (y.yakuman > 1 ? ' x' + y.yakuman : '') : T('han', y.han)) + '</td></tr>'; });
      h += '</table><div class="big">' + pointsText(w, r) + '</div></div>';
    });
  } else if (r.type === 'draw') {
    h += '<h3>' + (r.reason === 'nagashi' ? T('nagashi') : T('drawR')) + '</h3>';
    if (r.reason === 'nagashi') h += '<div class="big">' + r.nagashi.map(NAME).join(', ') + '</div>';
    for (var p = 0; p < 4; p++) {
      h += '<div style="margin-top:4px"><b>' + NAME(p) + '</b> ' + (r.tenpai[p] ? '<span class="tag ok">' + T('tenpaiL') + '</span>' : '<span class="tag">' + T('notenL') + '</span>') + (r.tenpai[p] ? handRow(p, r, null, false) : '') + '</div>';
    }
  } else {
    h += '<h3>' + TX.abortR[r.reason][KO ? 1 : 0] + (r.who >= 0 ? ' (' + NAME(r.who) + ')' : '') + '</h3>';
  }
  // score table
  h += '<table style="margin-top:6px">';
  for (var q = 0; q < 4; q++) {
    var d = r.scores[q] - r.start[q];
    h += '<tr><td>' + NAME(q) + ' <small>' + WIND((q - r.dealer + 4) % 4) + '</small></td><td style="text-align:right">' + r.start[q] + ' &rarr; <b>' + r.scores[q] + '</b> <span class="' + (d > 0 ? 'pos' : (d < 0 ? 'neg' : '')) + '">(' + (d > 0 ? '+' : '') + d + ')</span></td></tr>';
  }
  h += '</table>';
  if (r.over) {
    var fr = G.ranking;
    h += '<div class="big" style="margin-top:8px">' + T('final') + '</div><table>';
    fr.order.forEach(function (q, i) { h += '<tr><td>' + (i + 1) + T('place') + ' - ' + NAME(q) + '</td><td>' + G.players[q].score + '</td></tr>'; });
    h += '</table><div class="big">' + T('yourPlace', fr.rank[0]) + '</div>';
    if (r.overReason === 'bust') h += '<div style="text-align:center;opacity:.8">' + T('bust') + '</div>';
    if (r.overReason === 'agari-yame') h += '<div style="text-align:center;opacity:.8">' + T('yame') + '</div>';
  } else if (G.nextHonba > G.honba && G.nextRoundNum === G.roundNum) h += '<div style="text-align:center;opacity:.8;margin-top:4px">' + T('renchan', G.nextHonba) + '</div>';
  h += '<div class="btns"><button class="pri" id="resNext">' + (r.over ? T('again') : T('next')) + '</button></div>';
  var el = $('res'); el.innerHTML = h; el.style.display = 'block'; $('curtain').style.display = 'block';
  $('resNext').onclick = function () { closeResult(); };
  if (auto) scheduleResClose();
}
function scheduleResClose() {
  clearTimeout(resTimer);
  var myGen = gen, over = G.over;
  resTimer = setTimeout(function () { if (myGen !== gen) return; if ($('res').style.display === 'block') closeResult(); }, resDelay || (over ? 2800 : 1900));
}
function closeResult() {
  clearTimeout(resTimer);
  $('res').style.display = 'none'; $('curtain').style.display = 'none';
  if (!G) return;
  if (G.over) { autoGames++; newGame(); return; }
  G.nextRound(); ui.sel = null; ui.hint = null; pump();
}

function showHelp() {
  var el = $('help');
  el.innerHTML = '<h3>' + T('helpT') + '</h3>' + TX.help1[KO ? 1 : 0] + TX.help2[KO ? 1 : 0] + '<div class="btns" style="display:flex;justify-content:center;margin-top:8px"><button class="pri" id="helpX">' + T('close') + '</button></div>';
  el.style.display = 'block'; $('curtain').style.display = 'block';
  $('helpX').onclick = function () { el.style.display = 'none'; if ($('res').style.display !== 'block') $('curtain').style.display = 'none'; };
}
$('curtain').addEventListener('click', function () { if ($('help').style.display === 'block') { $('help').style.display = 'none'; if ($('res').style.display !== 'block') $('curtain').style.display = 'none'; } });
document.addEventListener('keydown', function (e) {
  var inShell = false; try { inShell = window.parent !== window && !!window.parent.setAutoMark; } catch (x) {}
  if (inShell) return;      // inside the card shell the shell forwards F2..F4 itself (handling them here too would toggle twice)
  if (e.key === 'F2') { e.preventDefault(); newGame(); } else if (e.key === 'F3') { e.preventDefault(); toggleAuto(); } else if (e.key === 'F4') { e.preventDefault(); giveHint(); }
});

/* ------------------------------------------------------------ test hook */
window.__mj = {
  G: function () { return G; }, MJ: MJ, auto: function () { return auto; }, autoGames: function () { return autoGames; },
  sim: function (n, cfg) { cfg = cfg || {}; cfg.seed0 = cfg.seed0 || 1; cfg.agents = cfg.agents || [{ level: 'full' }, { level: 'full' }, { level: 'full' }, { level: 'full' }]; return MJ.simulate(n, cfg); },
  skipTo: function (minDiscards, callOnly) { clearTimeout(timer); var n = 0; while (G.phase !== 'roundEnd' && n++ < 4000) { var pend = G.pendingPlayers(); if (!pend.length) break; var p = pend[0]; if (p === 0 && G.totalDiscards >= minDiscards && (callOnly ? G.phase === 'react' : G.phase === 'discard')) break; var a = (p === 0 ? HAI : AIS[p]).decide(G, p); G.act(p, a); } ui = { sel: null, riichiMode: false, hint: null, resShown: -1, flashN: G.callSeq }; pump(); return [G.phase, G.totalDiscards]; },
  setGame: function (g) { gen++; clearTimeout(timer); G = g; ui = { sel: null, riichiMode: false, hint: null, resShown: -1, flashN: G.callSeq, furiN: 0 }; $('res').style.display = 'none'; $('curtain').style.display = 'none'; pump(); },
  setAutoPace: function (ms) { autoPace = ms; }, setResDelay: function (ms) { resDelay = ms; },
  setPace: function (ms) { pace = ms; }, setFast: function (f) { fast = !!f; },
  state: function () { return G ? { phase: G.phase, turn: G.turn, round: G.roundNum, honba: G.honba, scores: G.players.map(function (p) { return p.score; }), sticks: G.sticks, over: G.over, pending: G.pendingPlayers() } : null; }
};

document.title = T('title');
newGame();
})();
</script>

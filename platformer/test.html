<script>
// Headless test helpers. window.testGen(seed0, count, levels) -> generation / validation / replay statistics.
window.testGen = function (seed0, count, levels) {
  var res = { total: 0, valid: 0, replayOk: 0, attempts: {}, ms: 0, maxMs: 0, fails: [], lim: PF.probe() };
  for (var s = seed0; s < seed0 + count; s++) for (var n = 1; n <= levels; n++) {
    var t0 = performance.now(), L = PF.generate(s, n), dt = performance.now() - t0;
    res.total++; res.ms += dt; if (dt > res.maxMs) res.maxMs = dt;
    res.attempts[L.attempt] = (res.attempts[L.attempt] || 0) + 1;
    if (L.valid) res.valid++; var rp = L.valid && PF.replay(L); if (rp) res.replayOk++; else res.fails.push([s, n]);
  }
  res.ms = Math.round(res.ms); res.maxMs = Math.round(res.maxMs); return res;
};
var q = new URLSearchParams(location.search);
if (q.get('gen')) document.getElementById('o').textContent = JSON.stringify(window.testGen(1, +q.get('gen'), +q.get('levels') || 5));
</script>
<script>
// auto-play statistics: for each (seed, level) the planner plays through the same input path as a human (bitmask per frame)
window.testAuto = function (seed0, count, level, maxLives) {
  var out = { total: 0, cleared: 0, ms: 0, deaths: 0, fails: [], frames: 0, maxPlanMs: 0 };
  for (var s = seed0; s < seed0 + count; s++) {
    var L = PF.generate(s, level), lives = maxLives || 1, cleared = false, pl = PFPlanner.make(), st = PF.newState(L), t0 = performance.now(), f = 0;
    while (f < 60 * L.time && !cleared) {
      var inp = pl.decide(st); PF.step(st, inp); f++;
      if (st.p.won) { cleared = true; break; }
      if (st.p.dead) { out.deaths++; lives--; if (lives <= 0) { out.fails.push([s, level, Math.round(st.p.x / 16), st.p.why]); break; } st = PF.newState(L, { cp: !!st.cp }); pl.reset(); }
    }
    if (!cleared && lives > 0) out.fails.push([s, level, 'timeout', Math.round(st.p.x / 16)]);
    out.plans = (out.plans || 0) + pl.stats.plans; out.planMs = (out.planMs || 0) + pl.stats.ms; out.total++; if (cleared) out.cleared++; out.ms += performance.now() - t0; out.frames += f;
  }
  out.ms = Math.round(out.ms); out.avgPlanMs = +(out.planMs / Math.max(1, out.plans)).toFixed(2); return out;
};

window.testBoss = function (v, seeds) {
  var res = { v: v, won: 0, n: 0, fails: [] };
  for (var s = 0; s < seeds; s++) {
    var rows = []; for (var r = 0; r < 12; r++) rows.push(' '.repeat(90)); rows.push('#'.repeat(90)); rows.push('#'.repeat(90));
    var L = mk(rows, [{ t: PF.E.BOSS, v: v, x: (50 + s * 3) * 16, y: 12 * 16 - 26, w: 28, h: 26, spd: 0, mn: 40 * 16, mx: 84 * 16, ax: 62 * 16, ay: 8 * 16 - 6, dir: -1 }], { goalX: 86 * 16, sx: 36 * 16 });
    L.cp = { x: 99999, y: 0 }; L.poleY = 12 * 16;
    var st = PF.newState(L), pl = PFPlanner.make(), f = 0;
    while (f < 4000 && !st.p.won && !st.p.dead) { PF.step(st, pl.decide(st)); f++; }
    res.n++; if (st.p.won) res.won++; else res.fails.push([s, f, st.p.dead ? st.p.why : 'timeout', st.en[0].hp]);
  }
  return res;
};

// auto-play on levels of a given kind: for each seed use the first level number in [lo,hi] whose kind matches
window.testKind = function (kind, seed0, count, lo, hi, lives) {
  var out = { kind: kind, total: 0, cleared: 0, deaths: 0, fails: [], levels: [] };
  for (var s = seed0; s < seed0 + count; s++) {
    var n = -1; for (var k = lo; k <= hi; k++) if (PF.kindOf(s, k) === kind) { n = k; break; } if (n < 0) continue;
    var L = PF.generate(s, n), pl = PFPlanner.make(), st = PF.newState(L), f = 0, lv = lives || 1, ok = false;
    while (f < 60 * L.time) { PF.step(st, pl.decide(st)); f++; if (st.p.won) { ok = true; break; } if (st.p.dead) { out.deaths++; lv--; if (lv <= 0) { out.fails.push([s, n, Math.round(st.p.x / 16), st.p.why]); break; } st = PF.newState(L, { cp: !!st.cp }); pl.reset(); } }
    if (!ok && lv > 0) out.fails.push([s, n, 'timeout', Math.round(st.p.x / 16)]);
    out.total++; if (ok) out.cleared++; out.levels.push(n);
  }
  return out;
};

window.testMaze = function (seed0, count, n0, n1) { var res = { total: 0, valid: 0, replayOk: 0, attempts: {}, ms: 0, maxMs: 0, fails: [], types: {} }; for (var s = seed0; s < seed0 + count; s++) for (var n = n0; n <= n1; n++) { var t0 = performance.now(), L = PF.generate(s, n, { kind: 'maze' }), dt = performance.now() - t0; res.total++; res.ms += dt; res.maxMs = Math.max(res.maxMs, dt); res.attempts[L.attempt] = (res.attempts[L.attempt] || 0) + 1; if (L.valid) res.valid++; if (L.valid && PF.replay(L)) res.replayOk++; else res.fails.push([s, n, L.attempt]); (L.route || []).forEach(function (g) { res.types[g.k] = (res.types[g.k] || 0) + 1; }); } res.ms = Math.round(res.ms); res.maxMs = Math.round(res.maxMs); return res; };

// auto-play on forced-kind levels at given level numbers
window.testForced = function (kind, seed0, count, n, lives) {
  var out = { kind: kind, n: n, total: 0, cleared: 0, deaths: 0, fails: [] };

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shape Runner</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1030;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column}
#stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
canvas{position:absolute;left:0;top:0;touch-action:none;outline:none;background:#0b1030}
#pad{flex:0 0 auto;display:none;box-sizing:border-box;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:#14193a;border-top:2px solid #2b3470;touch-action:none;justify-content:space-between;align-items:stretch;gap:10px}
#pad.on{display:flex}
#pad .grp{display:flex;gap:8px;flex:1 1 0}
#pad .grp.r{justify-content:flex-end}
#pad button{flex:1 1 0;max-width:150px;font:bold 15px/1 system-ui,sans-serif;color:#fff;background:#3a4aa8;border:2px solid #7e8ee8;border-bottom-width:4px;border-radius:12px;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
#pad button.run{background:#a84a3a;border-color:#e89a7e}
#pad button.jump{background:#2f8f5a;border-color:#7ee8a8}
#pad button.on{filter:brightness(1.6);transform:translateY(2px)}
</style>
<script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push(String(e.message)+" @"+e.filename+":"+e.lineno)});</script>
</head>
<body>
<div id="stage"><canvas id="cv" tabindex="0"></canvas></div>
<div id="pad">
  <div class="grp"><button type="button" id="bL" data-k="left">&#9664;</button><button type="button" id="bR" data-k="right">&#9654;</button></div>
  <div class="grp r"><button type="button" id="bRun" class="run" data-k="run">RUN</button><button type="button" id="bJ" class="jump" data-k="jump">JUMP</button></div>
</div>
<script src="sim.js"></script>
<script src="planner.js"></script>
<script src="game.js"></script>
</body>
</html>

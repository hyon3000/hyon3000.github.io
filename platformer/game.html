<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shape World</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0820;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column}
#stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
canvas{position:absolute;left:0;top:0;touch-action:none;outline:none;background:#0a0820}
#pad{flex:0 0 auto;display:none;box-sizing:border-box;padding:6px 14px calc(6px + env(safe-area-inset-bottom));background:#120e30;border-top:2px solid #3a2f80;touch-action:none;justify-content:space-between;align-items:center}
#padmid{display:flex;flex-direction:column;gap:5px;align-items:stretch;justify-content:center;flex:0 1 auto;min-width:0}
#padmid b{display:block;text-align:center;font:bold 10px/1.1 system-ui,sans-serif;color:#fff;background:#2b2470;border:2px solid #6a5ab8;border-radius:8px;padding:4px 8px;cursor:pointer;touch-action:none;-webkit-user-select:none}
#padmid b small{display:block;font-size:8px;opacity:.7;font-weight:600}
#pad.on{display:flex;height:clamp(96px,26vh,168px)}
.cross{position:relative;height:100%;aspect-ratio:1/1;max-width:44vw;touch-action:none;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:4px}
.cross b{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font:bold calc(var(--cs,150px)/12) / 1.05 system-ui,sans-serif;color:#fff;background:#4a3a9a;border:2px solid #9a8aff;border-bottom-width:4px;pointer-events:none;box-sizing:border-box;min-width:0;overflow:hidden}
.cross b small{font-size:calc(var(--cs,150px)/18);font-weight:600;opacity:.75;margin-top:1px;letter-spacing:.5px}
.cross b.on{filter:brightness(1.7);transform:translateY(2px)}
.cross .u{grid-area:1/2}.cross .l{grid-area:2/1}.cross .r{grid-area:2/3}.cross .d{grid-area:3/2}
.cross .hub{grid-area:2/2;border-radius:50%;background:#1c1646;border:2px solid #2b2470;margin:18%}
.cross.act b{background:#18907a;border-color:#7affe0}.cross.act .l{background:#c2561a;border-color:#ffa070}.cross.act .r{background:#a02a7a;border-color:#ff8ad8}.cross.act .d{background:#3a4a9a;border-color:#8aa0ff}
</style>
<script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push(String(e.message)+" @"+e.filename+":"+e.lineno)});</script>
</head>
<body>
<div id="stage"><canvas id="cv" tabindex="0"></canvas></div>
<div id="pad">
  <div class="cross mv" id="crossL"><b class="u" data-id="U">&#9650;<small>W</small></b><b class="l" data-id="L">&#9664;<small>A</small></b><i class="hub"></i><b class="r" data-id="R">&#9654;<small>D</small></b><b class="d" data-id="D">&#9660;<small>S</small></b></div>
  <div id="padmid"><b id="bMap">MAP<small>&#9003;</small></b><b id="bSup">WORLD<small>N</small></b><b id="bSel">STAGE<small>T</small></b></div>
  <div class="cross act" id="crossR"><b class="u" data-id="J">JUMP<small>I</small></b><b class="l" data-id="RUN">RUN<small>J</small></b><i class="hub"></i><b class="r" data-id="SPIN">SPIN<small>L</small></b><b class="d" data-id="ACT">ACT<small>K</small></b></div>
</div>
<script src="sim.js"></script>
<script src="gen.js"></script>
<script src="planner.js"></script>
<script src="ai-obs.js"></script>
<script src="ai-model.js"></script>
<script src="render.js"></script>
<script src="game.js"></script>
</body>
</html>

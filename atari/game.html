<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Breakout 2D</title>
<meta name="description" content="Breakout (2D), forked from Polynomino. Black bricks take 2 hits, white bricks 3 hits.">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#viewport{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;background:#000}
</style>
</head>
<body>
<div id="viewport"><canvas id="app"></canvas></div>
<script>
function fitViewport(){
  var vw=window.innerWidth,vh=window.innerHeight,r=1/2,w,h;
  if(vw/vh<r){w=vw;h=vw/r}else{h=vh;w=vh*r}
  var el=document.getElementById('viewport');
  el.style.width=Math.floor(w)+'px';el.style.height=Math.floor(h)+'px';
  window.dispatchEvent(new Event('resize'));
}
window.addEventListener("resize",function(){var vw=window.innerWidth,vh=window.innerHeight,r=1/2,w,h;if(vw/vh<r){w=vw;h=vw/r}else{h=vh;w=vh*r}var el=document.getElementById("viewport");el.style.width=Math.floor(w)+"px";el.style.height=Math.floor(h)+"px"});
fitViewport();
</script>
<script src="./start-bg.js"></script>
<script src="./texture.js"></script>
<script src="./common.js"></script>
<script src="./ai.js"></script>
<script src="./ai-model-2d.js"></script>
<script>window.ATARI_MODE="2d";</script>
<script src="./about.js"></script>
<script src="./breakout2d.js"></script>
<script>window.addEventListener('resize',function(){});</script>
</body></html>

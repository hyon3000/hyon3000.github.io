<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D Pinball</title>
<meta name="description" content="3D Pinball for Windows - Space Cadet (SpaceCadetPinball, MIT) in a Windows 98 frame.">
<link href="win98.css" media="screen" rel="stylesheet" type="text/css">
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: auto; background: #fff; }
.windows { position: relative; width: 100%; min-height: 100%; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; box-sizing: border-box; }
.d-main { position: relative; width: auto; display: inline-block; max-width: 100%; box-sizing: border-box; }
.d-main .title-bar .title-icon { background-image: url(icon_pinball.png); image-rendering: pixelated; }
.d-main .window-content { padding: 0; box-sizing: border-box; width: auto; border-left: 3px solid #808080; border-top: 3px solid #808080; border-right: 3px solid #fff; border-bottom: 3px solid #fff; background: #fff; }
/* the original page centres the runner in a 600px column; here it sits inside the window */
#frame { width: 640px; max-width: 100%; height: 478px; }
#frame iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
.d-hint { font-size: 11px; color: #333; margin: 3px 6px 4px; }
.windows-98 .window.gdialog { position: fixed; left: 50%; top: 120px; transform: translateX(-50%); z-index: 100; display: none; width: 300px; }
.gdialog .window-content { padding: 8px; box-sizing: border-box; width: auto; }
.gdialog .row { margin: 6px 0; }
/* menu items with a shortcut: the label on the left, the shortcut (F2 ...) pushed to the right edge (same as the Minesweeper page) */
.menu .ui-menu-item > a { display: flex; align-items: center; gap: 16px; }
.menu .ui-menu-item > a .mi-label { flex: 1 1 auto; text-align: left; }
.menu .ui-menu-item > a .mi-key { margin-left: auto; flex: 0 0 auto; min-width: 3ch; text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; opacity: .9; }
.menu, .menu .ui-menu-item > a, .menu .mi-label, .menu .mi-key { white-space: nowrap !important; }
ul.menu { min-width: 150px; width: max-content; }
/* the submenu arrow must not take room in the item (it sits at the right edge, like on the Minesweeper page) */
.menu .ui-menu-item > a { position: relative; }
.menu .ui-menu-icon.ui-icon { position: absolute !important; right: 4px; top: 50%; transform: translateY(-50%); margin: 0 !important; flex: 0 0 auto !important; pointer-events: none; }
</style>
</head>
<body>
<div class="windows windows-98">
  <div class="window has-menu d-main" id="mainwin">
    <div class="title-bar">
      <div class="title-icon"></div>
      <div class="title" data-t="title">3D Pinball</div>
      <div class="title-button-group">
        <div class="title-button minimize"></div>
        <div class="title-button maximize disabled" onclick="event.preventDefault();event.stopPropagation();return false;"></div>
        <div class="title-button close"></div>
      </div>
    </div>
    <ul class="menu-bar">
      <li>
        <a href="#" data-access-key="g" data-t="game">게임</a>
        <ul class="menu">
          <li onclick="return runMenu(function(){ newGame(); });"><a href="#"><span class="mi-label" data-t="new">　새 게임(N)</span><span class="mi-key">F2</span></a></li>
          <li class="separator"></li>
          <li onclick="return runMenu(function(){ document.getElementById('mainwin').style.visibility='hidden'; });"><a href="#" data-t="exit">　끝내기(X)</a></li>
        </ul>
      </li>
      <li>
        <a href="#" data-access-key="h" data-t="help">도움말</a>
        <ul class="menu">
          <li onclick="return runMenu(function(){ openHelp(); });"><a href="#" data-t="how">　게임 방법(H)</a></li>
          <li class="separator"></li>
          <li onclick="event.preventDefault();event.stopPropagation();return false;" style="cursor:default;">
            <a href="#" onclick="event.preventDefault();event.stopPropagation();return false;" style="cursor:default;" data-t="other">　다른 게임</a>
            <ul class="menu">
              <li onclick="return runMenu(function(){ window.location.href='../index.html'; });"><a href="#" data-t="mine">　지뢰찾기</a></li>
              <li onclick="return runMenu(function(){ window.location.href='../2048/index.html'; });"><a href="#">　2048</a></li>
              <li onclick="return runMenu(function(){ window.location.href='../polycube/index.html'; });"><a href="#" data-t="poly">　폴리큐브</a></li>
              <li onclick="return runMenu(function(){ window.location.href='../sudoku/index.html'; });"><a href="#">　스도쿠</a></li>
              <li onclick="return runMenu(function(){ window.location.href='../atari/index.html'; });"><a href="#">　아타리 브레이크아웃</a></li>
              <li onclick="return runMenu(function(){ window.location.href='../dino/index.html'; });"><a href="#">　T-Rex</a></li>
              <li onclick="return runMenu(function(){ window.location.href='../board/index.html'; });"><a href="#">　보드게임</a></li>
            </ul>
          </li>
        </ul>
      </li>
    </ul>
    <div class="window-content">
      <div id="frame"><iframe id="game" src="https://pinball.alula.me/" allow="fullscreen; autoplay" title="3D Pinball"></iframe></div>
      <div class="d-hint" id="hint"></div>
    </div>
  </div>

  <div class="window gdialog" id="helpWin">
    <div class="title-bar"><div class="title-icon"></div><div class="title" data-t="howT">게임 방법</div>
      <div class="title-button-group"><div class="title-button close" onclick="closeDlg('helpWin')"></div></div></div>
    <div class="window-content"><div id="helpTxt" style="font-size:12px;line-height:1.5"></div>
      <div class="row" style="text-align:center"><button type="button" class="title-button" style="padding:2px 10px;" onclick="closeDlg('helpWin')" data-t="ok">확인</button></div></div>
  </div>
</div>

<script src="vendor/jquery.min.js"></script>
<script src="vendor/jquery-ui.min.js"></script>
<script src="jquery.mswin.js"></script>
<script src="jquery.mswin.menu.js"></script>
<script src="pinball.js"></script>
</body>
</html>
